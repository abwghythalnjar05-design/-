<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" />
  <!-- Stylized Hisabi emblem -->
  <g filter="url(#glow)">
    <rect x="156" y="196" width="200" height="28" rx="14" fill="url(#emblemGrad)" />
    <rect x="236" y="196" width="28" height="130" rx="14" fill="url(#emblemGrad)" />
    <rect x="156" y="298" width="108" height="28" rx="14" fill="url(#emblemGrad)" />
    <circle cx="316" cy="260" r="18" fill="url(#emblemGrad)" />
  </g>
</svg>
